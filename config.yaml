# 26 Target Job Titles + Variants
target_job_titles:
  - "Azure Cloud Engineer"
  - "Senior Azure Cloud Engineer"
  - "Cloud Engineer"
  - "Senior Cloud Engineer"
  - "DevOps Engineer"
  - "Senior DevOps Engineer"
  - "Azure DevOps Engineer"
  - "Cloud Infrastructure Engineer"
  - "Infrastructure Engineer (Azure)"
  - "Terraform / IaC Engineer"
  - "Cloud Automation Engineer"
  - "Platform Engineer"
  - "Site Reliability Engineer (SRE)"
  - "Cloud Operations Engineer"
  - "Cloud Support Engineer (L2/L3)"
  - "Linux Systems Engineer"
  - "Senior Linux Administrator"
  - "DevSecOps Engineer"
  - "Cloud Security Engineer"
  - "Vulnerability Management Engineer"
  - "Patch Management / Security Compliance Engineer"
  - "Cloud Security Operations Engineer"
  - "Kubernetes / AKS Engineer"
  - "Cloud Migration Engineer"
  - "Azure Solutions Engineer"
  - "Technical Lead – Cloud" # Stretch category: include only when requirements fit

location_priority:
  - priority: 1
    name: "Bengaluru / Bangalore, India"
    tokens: ["bengaluru", "bangalore", "blr", "koramangala", "hsr layout", "indiranagar", "whitefield", "bellandur", "jp nagar", "electronic city", "outer ring road"]
    allow_arrangements: ["Onsite", "Hybrid", "Remote"]
  - priority: 2
    name: "Anywhere in India"
    cities: ["Hyderabad", "Pune", "Chennai", "Mumbai", "Delhi NCR", "Noida", "Gurgaon", "Kolkata", "Ahmedabad", "Jaipur", "Kochi", "Coimbatore", "Thiruvananthapuram"]
    allow_arrangements: ["Onsite", "Hybrid", "Remote"]
  - priority: 3
    name: "Worldwide remote"
    description: "Fully remote roles explicitly accepting candidates residing in India"
    strict_india_eligible: true

experience_filter:
  target_min_years: 3
  target_max_years: 6
  preferred_years: [4, 5]
  hard_exclude_min_years: 7 # Exclude roles explicitly requiring 7+ years
  evaluate_total_it_vs_cloud_title: true
  startup_flexibility: true # Do not reject senior title if listed responsibilities fit 4-5 yrs

freshness:
  confirmed_max_age_hours: 24
  require_original_posting_date: true
  unverified_date_to_review: true

history_display:
  previously_reviewed_cutoff_days: 3  # Display previously reviewed jobs in Section 4 for up to 3 days, then hide
  applied_retention_days: permanent   # Keep applied jobs permanently to guard against duplicate applications

sources:
  official_career_pages:
    enabled: true
    priority: 1
    target_confirmed_share: 0.70
  wellfound:
    enabled: true
    priority: 2
  linkedin_jobs:
    enabled: true
    priority: 3
    search_past_24h: true
  job_boards:
    enabled: true
    priority: 4

scoring_weights:
  technical_skills_match: 35
  responsibilities_match: 20
  experience_fit: 15
  location_eligibility: 10
  production_achievements: 10
  employer_role_fit: 5
  evidence_quality: 5
  total: 100

thresholds:
  apply_min_score: 50
  review_min_score: 40

storage:
  jobs_history_file: "data/jobs_history.json"
  application_history_file: "data/application_history.json"
  logs_file: "logs/job_finder.log"

schedule:
  time_kolkata: "08:30"
  timezone: "Asia/Kolkata"
  task_name: "BangaloreStartupJobFinderDaily"

notifications:
  email:
    enabled: true
    recipient: "chethankumarkv123@gmail.com"
    subject_prefix: "[Bangalore Startup Jobs]"
    attach_html: true
    smtp_server: "smtp.gmail.com"
    smtp_port: 587
