location_priority:
  - priority: 1
    name: "Bengaluru / Bangalore, India"
    tokens: ["bengaluru", "bangalore", "blr", "koramangala", "hsr layout", "indiranagar", "whitefield", "bellandur", "jp nagar", "electronic city", "outer ring road"]
    allow_arrangements: ["Onsite", "Hybrid", "Remote"]
  - priority: 2
    name: "Anywhere in India"
    cities: ["Hyderabad", "Pune", "Chennai", "Mumbai", "Delhi NCR", "Noida", "Gurgaon", "Kolkata", "Ahmedabad", "Jaipur", "Kochi", "Coimbatore", "Thiruvananthapuram"]
    allow_arrangements: ["Onsite", "Hybrid", "Remote"]
  - priority: 3
    name: "Worldwide remote"
    description: "Fully remote roles explicitly accepting candidates residing in India"
    strict_india_eligible: true

experience_filter:
  target_min_years: 3
  target_max_years: 6
  preferred_years: [4, 5]
  hard_exclude_min_years: 7 # Exclude roles explicitly requiring 7+ years
  startup_flexibility: true # Do not reject senior title if listed responsibilities fit 4-5 yrs

freshness:
  confirmed_max_age_hours: 24
  require_original_posting_date: true
  unverified_date_to_review: true

sources:
  official_career_pages:
    enabled: true
    priority: 1
    target_confirmed_share: 0.70 # Aim for at least 70% of confirmed listings
  wellfound:
    enabled: true
    priority: 2
  linkedin_jobs:
    enabled: true
    priority: 3
    search_past_24h: true
  job_boards:
    enabled: true
    priority: 4
    platforms:
      - "Hacker News (Who is Hiring)"
      - "RemoteOK"
      - "Jobicy"
      - "Arbeitnow"
      - "Naukri"
      - "Indeed India"
      - "Cutshort"
      - "Instahyre"
      - "Y Combinator"

scoring_weights:
  core_technical_match: 35
  duties_match: 20
  experience_fit: 15
  location_eligibility: 10
  production_scale_impact: 10
  employer_role_fit: 5
  evidence_quality: 5
  total: 100

thresholds:
  apply_min_score: 65
  review_min_score: 40

schedule:
  time_kolkata: "08:00"
  timezone: "Asia/Kolkata"
  task_name: "BangaloreStartupJobFinderDaily"

